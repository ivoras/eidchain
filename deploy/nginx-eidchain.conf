server {
    server_name eidchain.ivoras.net;
    root /srv/eidchain/www;
    index index.html;

    # --- Croatian eID client-certificate authentication -------------------
    # AKDCA Root + HRIDCA (from https://eid.hr/en/certificates/certificates-akdca-root-and-hridca)
    ssl_client_certificate /etc/nginx/hr-eid-ca.pem;
    ssl_verify_client optional;      # public pages stay reachable without a card
    ssl_verify_depth 2;
    # Revocation checking is NOT enabled yet: the end-entity OCSP/CRL URLs
    # have to be read from a real card certificate (AIA / CDP extensions).
    # Then add: ssl_ocsp on; (nginx 1.19+) or ssl_crl /etc/nginx/hr-eid.crl;

    location / {
        try_files $uri $uri/ =404;
    }

    # Client-side signer: static files only. The CSP keeps the page from talking
    # to any server (connect-src 'none'), so the document cannot leave the browser.
    location /signer/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # eidchain node: chain API and example web app (systemd unit "eidchain",
    # listening on loopback). The app uses relative URLs, so a prefix works.
    location = /chain {
        return 301 /chain/;
    }

    location /chain/ {
        client_max_body_size 16m;        # gossiped blocks can be large; payloads are tiny
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;          # payload submission waits for the OCSP responder
    }

    # Everything under /login/ requires a verified card certificate.
    location /login/ {
        default_type text/plain;
        if ($ssl_client_verify != SUCCESS) {
            return 403 "Client certificate required or not accepted ($ssl_client_verify)\n";
        }
        try_files $uri $uri/ =404;
    }

    # Shows what nginx saw; also the place to hand the identity to a backend.
    location = /login/whoami {
        if ($ssl_client_verify != SUCCESS) {
            return 403 "Client certificate required or not accepted ($ssl_client_verify)\n";
        }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "verify:      $ssl_client_verify\nsubject:     $ssl_client_s_dn\nissuer:      $ssl_client_i_dn\nserial:      $ssl_client_serial\nfingerprint: $ssl_client_fingerprint\nnot before:  $ssl_client_v_start\nnot after:   $ssl_client_v_end\n";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eidchain.ivoras.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eidchain.ivoras.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = eidchain.ivoras.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name eidchain.ivoras.net;
    return 404; # managed by Certbot


}
